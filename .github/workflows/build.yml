name: Build BatteryETA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Theos and iOS SDK
        run: |
          brew install ldid xz
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -sL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz | tar -xJ -C "$HOME/theos/sdks"

      - name: Build Rootless DEB
        run: make package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: BatteryETA-deb
          path: packages/*.deb
